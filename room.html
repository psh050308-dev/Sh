<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>wiw 아지트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-bleed diorama canvas; small rounded chips in the corners; a nameplate speech bubble at the bottom, like a villager talking */
:root{
  --bg:#efd6ae; --bg-deep:#c99a74; --card:#fff8ea; --ink:#4b3a2a; --muted:#8c7458;
  --leaf:#7cc79a; --leaf-ink:#235a3d; --tag:#f4bd4f; --line:#ead9bd;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme: light;
}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse at 50% 38%, var(--bg) 0%, var(--bg-deep) 100%);
  background-color:var(--bg); color:var(--ink); font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}

.hud{
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); left:max(16px,env(safe-area-inset-left,0px));
  background:var(--card); border-radius:22px; padding:12px 16px 12px 14px; max-width:min(300px, calc(100% - 120px));
  box-shadow:0 6px 0 rgba(120,84,48,.18), 0 14px 30px rgba(90,60,30,.18); display:grid; gap:6px;
}
.hud h1{margin:0; font-family:var(--display); font-weight:400; font-size:22px; line-height:1.1; display:flex; align-items:center; gap:8px; text-wrap:balance}
.hud h1 .leaf{width:22px;height:22px;border-radius:50% 0 50% 0;background:var(--leaf);transform:rotate(-8deg);flex:none}
.hud p{margin:0; font-size:13px; color:var(--muted); line-height:1.45}
.keys{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12.5px; color:var(--ink)}
.keys span{display:inline-flex; align-items:center; gap:4px}
kbd{font-family:var(--display); font-size:12px; background:#f3e6cf; border-bottom:2px solid #d9c29c; border-radius:7px; padding:1px 6px}
.touch-only{display:none}
body.touch .touch-only{display:block}
body.touch .key-only{display:none}

.corner{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); right:max(16px,env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:8px}
.chip{
  width:44px; height:44px; border-radius:50%; border:0; background:var(--card); color:var(--ink);
  font-family:var(--display); font-size:22px; line-height:1; cursor:pointer;
  box-shadow:0 4px 0 rgba(120,84,48,.2), 0 8px 18px rgba(90,60,30,.15);
}
.chip:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(120,84,48,.2)}
.chip:focus-visible, #act:focus-visible{outline:3px solid var(--leaf-ink); outline-offset:2px}

.bubble{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  transform:translateX(-50%) translateY(0); width:max-content; max-width:min(460px, calc(100% - 32px));
  background:var(--card); border-radius:30px; padding:20px 24px 15px;
  box-shadow:0 6px 0 rgba(120,84,48,.18), 0 16px 34px rgba(90,60,30,.22);
  transition:opacity .18s ease, transform .18s ease;
}
.bubble.off{opacity:0; transform:translateX(-50%) translateY(10px); pointer-events:none}
.bubble .tag{
  position:absolute; top:-15px; left:20px; background:var(--tag); color:#5a3b10;
  font-family:var(--display); font-size:16px; padding:4px 14px 3px; border-radius:999px; transform:rotate(-3deg);
  box-shadow:0 3px 0 rgba(120,84,48,.2)
}
.bubble .msg{margin:0; font-size:15.5px; line-height:1.5; text-wrap:pretty}
.bubble .hint{margin:4px 0 0; font-size:12.5px; color:var(--muted)}
body.touch .bubble{bottom:calc(env(safe-area-inset-bottom,0px) + 168px)}

#joy{
  position:fixed; left:max(26px,calc(env(safe-area-inset-left,0px) + 18px)); bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  width:124px; height:124px; border-radius:50%; background:rgba(255,248,234,.45); border:3px solid rgba(255,248,234,.85);
  display:none; touch-action:none;
}
#knob{position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; background:var(--card); box-shadow:0 4px 0 rgba(120,84,48,.25)}
#act{
  position:fixed; right:max(26px,calc(env(safe-area-inset-right,0px) + 18px)); bottom:calc(env(safe-area-inset-bottom,0px) + 50px);
  width:84px; height:84px; border-radius:50%; border:0; background:var(--leaf); color:var(--leaf-ink);
  font-family:var(--display); font-size:17px; display:none; box-shadow:0 5px 0 #4f9a6f; touch-action:none;
}
#act:active{transform:translateY(3px); box-shadow:0 2px 0 #4f9a6f}
body.touch #joy, body.touch #act{display:block}
@media (pointer:coarse){ #joy,#act{display:block} .touch-only{display:block} .key-only{display:none} .bubble{bottom:calc(env(safe-area-inset-bottom,0px) + 168px)} }
@media (max-width:520px){ .hud h1{font-size:19px} .hud{padding:10px 14px} }
.hud.min p, .hud.min .keys{display:none}
#load{position:fixed; inset:0; display:grid; place-items:center; font-family:var(--display); font-size:20px; color:var(--ink)}
@media (prefers-reduced-motion: reduce){ .bubble{transition:none} }
</style>

<canvas id="c" tabindex="0" aria-label="3D 아지트 공간. 방향키로 캐릭터를 움직이세요."></canvas>
<div id="load">아지트 짓는 중…</div>

<div class="hud" id="hud">
  <h1><span class="leaf" aria-hidden="true"></span>wiw 아지트</h1>
  <p>가구 가까이 가서 살펴보세요. 소파에 앉을 수도, 조명을 끄고 켤 수도 있어요.</p>
  <div class="keys key-only">
    <span><kbd>WASD</kbd><kbd>←↑↓→</kbd> 이동</span>

    <span><kbd>E</kbd><kbd>Space</kbd> 살펴보기</span>
  </div>
  <p class="touch-only">왼쪽 스틱으로 걷고, 오른쪽 버튼으로 살펴보세요.</p>
</div>

<div class="corner">
  <button class="chip" id="zin" aria-label="가까이 보기">+</button>
  <button class="chip" id="zout" aria-label="멀리 보기">−</button>
  <button class="chip" id="help" aria-label="안내 접기">?</button>
</div>

<div class="bubble off" id="bubble" role="status" aria-live="polite">
  <span class="tag" id="btag">원형 거울</span>
  <p class="msg" id="bmsg"></p>
  <p class="hint" id="bhint"></p>
</div>

<div id="joy" aria-hidden="true"><div id="knob"></div></div>
<button id="act">살펴보기</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="look.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const W = 20, D = 14, H = 4.2;           // room footprint (x by z) and wall height, in metres-ish
const isTouch = matchMedia('(pointer:coarse)').matches;
if (isTouch) { document.body.classList.add('touch'); if (innerWidth < 600) $('hud').classList.add('min'); }
// Inside the 출석부 site the room runs as room.html?embed=1 and talks to its parent page.
const EMBED = new URLSearchParams(location.search).has('embed') && parent !== window;
if (EMBED) $('hud').querySelector('p').textContent = '반짝이는 출석부를 살펴보면 내 출석 기록이 열려요. 소파에 앉거나 조명을 끄고 켤 수도 있어요.';

// ---------- renderer / scene ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 120);

scene.add(new THREE.HemisphereLight('#fff1d8', '#a88f72', 0.62));
const sun = new THREE.DirectionalLight('#ffe9c8', 1.0);
sun.position.set(-7, 15, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 12, bottom: -12, near: 1, far: 50 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);

// ---------- helpers ----------
let seed = 20261023;
const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pick = a => a[Math.floor(rnd() * a.length)];
const mats = {};
function M(color, o = {}) {
  const k = color + JSON.stringify(o);
  return mats[k] || (mats[k] = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .85, metalness: 0 }, o)));
}
function rrect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
const gcache = {};
function rgeo(w, h, d, b = .06) {
  const k = [w, h, d, b].map(v => v.toFixed(3)).join();
  if (gcache[k]) return gcache[k];
  b = Math.min(b, w * .45, h * .45, d * .45);
  const bs = b * .6, r = b * .4;
  const g = new THREE.ExtrudeGeometry(rrect(w - 2 * bs, h - 2 * bs, r), {
    depth: Math.max(d - 2 * bs, .001), bevelEnabled: true, bevelThickness: bs, bevelSize: bs, bevelSegments: 3, curveSegments: 4
  });
  g.center();
  return gcache[k] = g;
}
const box = (w, h, d, m, b) => new THREE.Mesh(rgeo(w, h, d, b), m);
const cyl = (rt, rb, h, m, s = 20) => new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, s), m);
const sph = (r, m, ws = 24, hs = 16) => new THREE.Mesh(new THREE.SphereGeometry(r, ws, hs), m);
function at(o, x, y, z, parent) { o.position.set(x, y, z); (parent || scene).add(o); return o; }
function group(x, z, ry = 0) { const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g); return g; }

function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function speckle(g, w, h, n, colors, rMax) {
  for (let i = 0; i < n; i++) { g.fillStyle = pick(colors); g.beginPath(); g.arc(rnd() * w, rnd() * h, rnd() * rMax + .5, 0, 7); g.fill(); }
}

// ---------- textures ----------
const tileTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#b9ad9c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const v = 200 + Math.floor(rnd() * 10);
    g.fillStyle = `rgb(${v},${v - 10},${v - 24})`;
    g.fillRect(i * 128 + 3, j * 128 + 3, 122, 122);
  }
  g.globalAlpha = .18; speckle(g, w, h, 900, ['#a89880', '#fff8ec', '#c9bba6'], 1.6); g.globalAlpha = 1;
}, W / 2, D / 2);
function concrete(base, light) {
  return (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 70; i++) {
      const x = rnd() * w, y = rnd() * h, r = 20 + rnd() * 70;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, rnd() > .5 ? 'rgba(255,255,255,.10)' : 'rgba(60,50,40,.10)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    if (!light) {
      g.strokeStyle = 'rgba(70,60,50,.18)'; g.lineWidth = 2;
      for (let y = 128; y < h; y += 128) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
      g.fillStyle = 'rgba(70,60,50,.35)';
      for (let x = 64; x < w; x += 128) for (let y = 64; y < h; y += 128) { g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); }
    }
    g.globalAlpha = .2; speckle(g, w, h, 1500, ['#857a6c', '#e8e2d8'], 1.2); g.globalAlpha = 1;
  };
}
const concreteTex = canvasTex(512, 512, concrete('#b3ada3', false), W / 4.5, H / 4.5);
const paintTex = canvasTex(512, 512, concrete('#e7e1d6', true), D / 4.5, H / 4.5);
function woodTex(base, grain, rep = 1) {
  return canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    g.strokeStyle = grain; g.lineWidth = 1.4;
    for (let i = 0; i < 46; i++) {
      g.globalAlpha = .12 + rnd() * .18; const y0 = rnd() * h, a = 2 + rnd() * 6, f = .01 + rnd() * .03;
      g.beginPath(); for (let x = 0; x <= w; x += 8) g.lineTo(x, y0 + Math.sin(x * f + i) * a); g.stroke();
    }
    g.globalAlpha = 1;
  }, rep, rep);
}
const plyTex = woodTex('#dfc394', '#a9844f', .9);
const slabTex = woodTex('#c49a6c', '#7e5a37', .7);
const stripeTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#f4a9b2'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#d93f3f';
  for (let k = -3; k < 6; k++) {
    g.beginPath();
    for (let x = 0; x <= w; x += 8) g.lineTo(x, k * 56 + x * .45 + Math.sin(x * .05) * 10);
    for (let x = w; x >= 0; x -= 8) g.lineTo(x, k * 56 + 26 + x * .45 + Math.sin(x * .05 + 1) * 10);
    g.fill();
  }
}, 1.4, 1.4);
const throwTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#f3e7d3'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#cf3b35';
  for (let i = 0; i < 9; i++) {
    const x = rnd() * w, y = rnd() * h; g.beginPath();
    for (let a = 0; a < 6.3; a += .5) { const r = 18 + rnd() * 16; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r * .7); }
    g.fill();
  }
  g.fillStyle = '#e88a8a'; for (let i = 0; i < 30; i++) g.fillRect(rnd() * w, rnd() * h, 10, 3);
}, 1.2, 1.2);
const tapestryTex = canvasTex(256, 384, (g, w, h) => {
  g.fillStyle = '#e9e1c6'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#3f6e52'; g.fillRect(14, 14, w - 28, h - 28);
  g.strokeStyle = '#e9e1c6'; g.lineWidth = 4; g.strokeRect(26, 26, w - 52, h - 52);
  g.fillStyle = '#e9e1c6';
  g.beginPath(); g.ellipse(w / 2, 120, 58, 34, 0, 0, 7); g.fill();
  g.fillStyle = '#3f6e52'; g.beginPath(); g.arc(w / 2, 120, 18, 0, 7); g.fill();
  g.fillStyle = '#e9e1c6'; g.font = '700 30px sans-serif'; g.textAlign = 'center'; g.fillText('AZIT', w / 2, 210);
  for (let i = 0; i < 5; i++) { g.beginPath(); g.arc(60 + i * 34, 270, 9, 0, 7); g.fill(); }
  g.beginPath(); g.moveTo(w / 2 - 50, 340); g.lineTo(w / 2, 300); g.lineTo(w / 2 + 50, 340); g.closePath(); g.fill();
});
const mirrorTex = canvasTex(256, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, w, h);
  gr.addColorStop(0, '#dfeaf2'); gr.addColorStop(.5, '#b7c7d6'); gr.addColorStop(1, '#8e9fb4');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.55)';
  g.save(); g.translate(w * .35, h * .3); g.rotate(-.7); g.fillRect(-90, -8, 180, 14); g.fillRect(-60, 22, 120, 7); g.restore();
});

// ---------- palette ----------
const C = {
  ply: M('#e0c596', { map: plyTex }), slab: M('#c99f71', { map: slabTex }), metal: M('#c8ccd1', { metalness: .6, roughness: .35 }),
  dark: M('#2d2d31', { roughness: .5 }), cream: M('#f3e9d6'), white: M('#f7f4ee', { roughness: .6 }),
  block: M('#9c9890'), green: M('#5a9a63'), black: M('#1d1d20', { roughness: .4 }),
};
const BOOKS = ['#d9543f', '#3e6fa8', '#f0c24b', '#5a9a6e', '#efe6d4', '#2f3b4c', '#c77da8', '#e88a3c', '#7b5ea7', '#9fc6dd'];

// ---------- room shell ----------
const floor = new THREE.Mesh(new THREE.BoxGeometry(W, .5, D), [
  M('#a99b88'), M('#a99b88'), M('#ffffff', { map: tileTex, roughness: .55 }), M('#a99b88'), M('#a99b88'), M('#a99b88')
]);
at(floor, 0, -.25, 0);
const wallTop = M('#8f877c');
const backWall = new THREE.Mesh(new THREE.BoxGeometry(W + .3, H, .3), [wallTop, wallTop, wallTop, wallTop, M('#ffffff', { map: concreteTex }), wallTop]);
at(backWall, .15 - .15, H / 2, -D / 2 - .15);
const leftWall = new THREE.Mesh(new THREE.BoxGeometry(.3, H, D + .3), [M('#ffffff', { map: paintTex }), wallTop, wallTop, wallTop, wallTop, wallTop]);
at(leftWall, -W / 2 - .15, H / 2, -.15);
// exposed ceiling beam + pipe along the back wall, like the photo
at(box(W, .35, .7, M('#c9c3b8'), .02), 0, H - .18, -D / 2 + .35);
const pipe = cyl(.06, .06, W, M('#e9e6e0', { roughness: .5 }), 10); pipe.rotation.z = Math.PI / 2; at(pipe, 0, H - .55, -D / 2 + .25);

// ---------- collision + interactables ----------
const solids = [];
const solid = (x0, x1, z0, z1) => solids.push({ x0, x1, z0, z1 });
const items = [];
const item = (o) => (items.push(o), o);
const lights = {};

// rug under the lounge corner
at(box(6.4, .03, 5.2, M('#e6d3b3'), .015), -.4, .015, -2.2);

// ---------- door (back wall, left zone) ----------
{
  const g = group(-8, -D / 2 + .02);
  at(box(1.35, 2.45, .1, M('#b4b5b1'), .02), 0, 1.22, 0, g);
  at(box(1.15, 2.3, .08, M('#d3d4cf'), .02), 0, 1.15, .05, g);
  for (const [y, hh] of [[1.75, .7], [.7, .9]]) for (const x of [-.27, .27]) at(box(.38, hh, .04, M('#c6c7c2'), .02), x, y, .1, g);
  at(sph(.06, C.metal), .45, 1.1, .14, g);
  at(box(.3, .14, .02, M('#f0a33a')), 0, 1.95, .1, g);
  item({ name: '출입문', g, rect: [-8.7, -7.3, -7, -6.3], act: () => '문 너머로 계단 소리가 들려요. 오늘은 아지트에 더 있을래요.' });
}

// ---------- 출석부: a spiral notebook on a lectern by the entrance (placeholder spot) ----------
let attendMark;
{
  const g = group(-2.4, 3.4), wood = M('#c99b66', { map: slabTex });
  at(cyl(.24, .28, .05, wood, 22), 0, .025, 0, g);
  at(cyl(.045, .055, .92, wood, 10), 0, .5, 0, g);
  const top = new THREE.Group(); at(top, 0, .98, 0, g); top.rotation.x = .35;
  at(box(.66, .045, .48, wood, .015), 0, 0, 0, top);
  at(box(.62, .03, .05, wood, .01), 0, .03, .23, top);
  at(box(.58, .014, .38, M('#3f6e52'), .006), 0, .03, -.02, top);
  for (const sx of [-1, 1]) at(box(.27, .016, .35, M('#fffdf6'), .005), sx * .14, .045, -.02, top);
  const pageTex = canvasTex(512, 320, (c, w, h) => {
    c.fillStyle = '#fffdf6'; c.fillRect(0, 0, w, h);

// ---------- plywood open bookshelves (rods + planks) ----------
function bookshelf(cx, cz, len, dep, levels, ry = 0) {
  const g = group(cx, cz, ry);
  levels.forEach((y, li) => {
    at(box(len, .04, dep, C.ply, .015), 0, y, 0, g);
    let x = -len / 2 + .2;
    while (x < len / 2 - .4) {
      const kind = rnd();
      if (kind < .45) {          // flat stack
        const n = 1 + Math.floor(rnd() * 3); let yy = y + .02;
        const w = .34 + rnd() * .14;
        for (let i = 0; i < n; i++) { const h = .035 + rnd() * .03; at(box(w, h, .26 + rnd() * .05, M(pick(BOOKS)), .008), x + w / 2, yy + h / 2, (rnd() - .5) * .1, g).rotation.y = (rnd() - .5) * .3; yy += h; }
        x += w + .15 + rnd() * .2;

      at(new THREE.Mesh(VG.beanieBand, M('#d99a2b')), 0, .14, -.02, accG).rotation.x = Math.PI / 2 - .15;

}
const P = makeVillager({ skin: 0, hair: 1, style: 0, shirt: 0, pants: 0, acc: 1 });
const player = P.root, body = P.body, legs = P.legs, arms = P.arms, head = P.head, blob = P.blob;
scene.add(player);
player.position.set(.5, 0, 3.2);

// ---------- interactions ----------
let sitting = false;
const pops = [];
function pop(g) { if (g) pops.push({ g, t: 0, s: g.scale.clone() }); }
function toggle(key) {

  L.light.intensity = L.on ? L.base : 0;
  L.mesh.material = L.on ? L.onMat || (L.onMat = L.mesh.material) : (L.offMat || (L.offMat = M('#e8e2d6')));

let waterT = -1;
function water() { waterT = 0; }
function sit() {

  if (!xs.length) return '소파 자리가 꽉 찼어요. 다음에 앉아요!';

// bubble

function say(name, msg) {

}

}

// ---------- friends who are in (sent by the 출석부 site when embedded) ----------
const SPOTS = [
  { x: -1.92, z: -3.5, ry: 0, y: .36 - SIT_DY, sofa: true }, { x: .92, z: -3.5, ry: 0, y: .36 - SIT_DY, sofa: true }, { x: -.5, z: -3.5, ry: 0, y: .36 - SIT_DY, sofa: true },
  { x: -6.6, z: -6.15, ry: 0, y: .38 - SIT_DY }, { x: -4.8, z: -6.15, ry: 0, y: .38 - SIT_DY },
  { x: -6.6, z: -1.55, ry: Math.PI, y: .38 - SIT_DY }, { x: -4.8, z: -1.55, ry: Math.PI, y: .38 - SIT_DY }, { x: -3.65, z: -2.55, ry: -Math.PI / 2, y: .38 - SIT_DY },
  { x: 4.6, z: -5.95, ry: Math.PI, stand: true }, { x: 2.5, z: 1.8, ry: Math.PI, stand: true }, { x: 8.3, z: 1.6, ry: Math.PI / 2, stand: true },
  { x: -8.4, z: -4.9, ry: -Math.PI / 2, stand: true }, { x: 5.6, z: -2.7, ry: -.6, stand: true }, { x: 6.2, z: 4.2, ry: -.5, stand: true },
];
const npcs = new Map();
function hashId(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

}
function freeSpot(id) {

}

}
function drawTag(n, text) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 120;
  const c = cv.getContext('2d'), tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  const paint = () => {
    c.clearRect(0, 0, 512, 120);
    const face = 'px Jua, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    c.font = '52' + face; c.textAlign = 'center'; c.textBaseline = 'middle';
    const fit = Math.min(52, Math.floor(52 * 430 / c.measureText(text).width));
    c.font = fit + face;
    const w = Math.min(500, c.measureText(text).width + 64), x = 256 - w / 2;
    c.fillStyle = 'rgba(120,84,48,.28)'; roundRect(c, x, 16, w, 90, 45); c.fill();
    c.fillStyle = '#fff8ea'; roundRect(c, x, 8, w, 90, 45); c.fill();
    c.fillStyle = '#4b3a2a'; c.fillText(text, 256, 55);

  n.tag.material.map = tex; n.tag.material.needsUpdate = true;

}
function spawn(id, spotIdx) {

  v.root.position.set(s.x, s.y || 0, s.z); v.root.rotation.y = s.ry; v.blob.visible = !!s.stand;
  if (!s.stand) { v.legs.forEach(l => l.rotation.x = -1.45); v.arms.forEach(a => a.rotation.x = -.25); }
  scene.add(v.root);
  const tag = new THREE.Sprite(new THREE.SpriteMaterial({ depthTest: false, transparent: true, toneMapped: false }));
  tag.renderOrder = 10; tag.scale.set(1.7, .4, 1); at(tag, 0, 2.2 + (HEAD_Y - 1.3), 0, v.root);
  const n = { id, v, s, spot: spotIdx, tag, name: '', waveT: -1, phase: hashId(id) % 100 };
  n.item = item({
    name: '', g: v.root, pri: .2, hint: '인사해 볼까요?',
    rect: s.sofa ? [s.x - .45, s.x + .45, s.z - .45, s.z + .95] : [s.x - .5, s.x + .5, s.z - .5, s.z + .5],
    act: () => { n.waveT = 0; return n.name + '님이 반갑게 손을 흔들어요!'; }
  });

function despawn(id) {
  const n = npcs.get(id);
  if (!n) return;
  scene.remove(n.v.root);
  if (n.tag.material.map) n.tag.material.map.dispose();
  n.tag.material.dispose();

  for (const raw of list.slice(0, 60)) {
    if (!raw || typeof raw.id !== 'string' || !raw.id) continue;
    const id = raw.id.slice(0, 128);
    if (seen.has(id)) continue;
    seen.add(id);
    let n = npcs.get(id);
    if (!n) { const i = freeSpot(id); if (i < 0) continue; n = spawn(id, i); }
    n.v.setLook(raw.look);
    const chars = [...(typeof raw.name === 'string' && raw.name.trim() ? raw.name.trim() : '친구')];
    const name = chars.slice(0, 10).join('') + (chars.length > 10 ? '…' : '');

}
if (EMBED) addEventListener('message', e => {
  if (e.origin !== location.origin || e.source !== parent) return;

// ---------- input ----------
const keys = {};
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if ((e.code === 'KeyE' || e.code === 'Space' || e.code === 'Enter') && !e.repeat && e.target.tagName !== 'BUTTON') act();
  keys[e.code] = true;
});

const joy = { x: 0, y: 0, id: null };
const joyEl = $('joy'), knob = $('knob');

joyEl.addEventListener('pointerup', endJoy); joyEl.addEventListener('pointercancel', endJoy);
function moveJoy(e) {
  const r = joyEl.getBoundingClientRect(), R = r.width / 2 - 10;
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const l = Math.hypot(dx, dy); if (l > R) { dx *= R / l; dy *= R / l; }

$('act').addEventListener('pointerdown', e => { e.preventDefault(); act(); });
addEventListener('touchstart', () => document.body.classList.add('touch'), { once: true, passive: true });
let zoom = 1;
const setZoom = z => { zoom = Math.min(1.6, Math.max(.55, z)); };
$('zin').onclick = () => setZoom(zoom * .85);
$('zout').onclick = () => setZoom(zoom / .85);
$('help').onclick = () => $('hud').classList.toggle('min');
canvas.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom * (1 + Math.sign(e.deltaY) * .08)); }, { passive: false });

// ---------- movement + collision ----------
const R = .34;
function collide(p) {
  p.x = Math.min(W / 2 - R, Math.max(-W / 2 + R, p.x));
  p.z = Math.min(D / 2 - R, Math.max(-D / 2 + R, p.z));
  for (let pass = 0; pass < 2; pass++) for (const b of solids) {
    const cx = Math.min(b.x1, Math.max(b.x0, p.x)), cz = Math.min(b.z1, Math.max(b.z0, p.z));
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;

    else {

let facing = 0, phase = 0, moveAmt = 0;

const camTarget = new THREE.Vector3(0, 0, 0);
const camOff = new THREE.Vector3(0, 9, 10.5);
const tmp = new THREE.Vector3();

  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
let readySent = false;
function frame() {

  let len = Math.hypot(ix, iz);
  if (len > 1) { ix /= len; iz /= len; len = 1; }

  if (sitting && len > 0) standUp();

  const p = player.position;
  if (!sitting) {
    const run = keys.ShiftLeft || keys.ShiftRight || len > .95 && joy.id !== null;
    const speed = (run ? 5.4 : 3.2) * len;
